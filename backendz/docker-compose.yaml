# backendz 完整独立部署编排（go-zero 改写版后台）
# 本文件为自包含堆栈：自带 postgres + redis + backendz 服务，使用独立 bridge 网络，
# 数据落盘到命名卷（postgres-data / redis-data），可整体 up/down，不影响其它项目。
# 依赖关系：backendz 需等待 postgres 健康后才启动（服务名 postgres/redis 与 etc/admin-api.yaml 一致）。

networks:
  app-tier:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: docker.io/bitnami/postgresql:latest
    restart: always
    ports:
      - "5432:5432"
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=*Abcd123456
      - POSTGRES_DB=gwa
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/bitnami/postgresql
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gwa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/bitnami/redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-tier
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=*Abcd123456
      - REDIS_AOF_ENABLED=no
      - REDIS_IO_THREADS_DO_READS=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
      - TZ=Asia/Shanghai
    volumes:
      - redis-data:/bitnami/redis/data

  backendz:
    image: go-wind-admin/backendz
    restart: always
    pull_policy: never
    networks:
      - app-tier
    ports:
      - "8888:8888"     # HTTP API（admin-api）
      - "6060:6060"     # DevServer（metrics / pprof / healthz）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./   # Dockerfile 所在目录
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: backendz
        APP_VERSION: 1.0.0