# Keycloak SSO 演练环境（开发/演示用，非生产部署）

# 用途：本地拉起单容器 Keycloak，配合 backend/scripts/sso/setup-keycloak.mjs
# 一键建 realm/client/user，即可演示和实测 OIDC SSO 登录全流。
# 生产部署请用独立 Keycloak/Authentik 集群，勿用 start-dev 模式。

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: gwa-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    # 数据存内嵌 H2（容器删除即失）；演练环境够用，持久化请挂卷或外接 PG
