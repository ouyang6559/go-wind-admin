syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "gnostic/openapi/v3/annotations.proto";

// 后台首页分析概览服务（只读聚合）
service DashboardService {
  // 获取概览统计（用户总数 / 角色总数 / 今日登录次数 / 今日操作审计条数）
  rpc GetOverview (google.protobuf.Empty) returns (DashboardOverviewResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/overview"
    };
  }

  // 获取近 N 天每日登录次数趋势
  rpc GetLoginTrend (GetLoginTrendRequest) returns (LoginTrendResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/login-trend"
    };
  }

  // 操作审计按 action 分布
  rpc GetOperationActionDistribution (google.protobuf.Empty) returns (ActionDistributionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/operation-action-distribution"
    };
  }

  // 登录审计按 status 分布
  // AI 概览解读：当日指标喂给默认模型生成中文解读（平台用户专属——数据会外发到模型端点）
  rpc GetAiInsights (google.protobuf.Empty) returns (AiInsightsResponse) {
    option (google.api.http) = {
      post: "/admin/v1/dashboard/ai-insights"
      body: "*"
    };
  }

  rpc GetLoginStatusDistribution (google.protobuf.Empty) returns (StatusDistributionResponse) {
    option (google.api.http) = {
      get: "/admin/v1/dashboard/login-status-distribution"
    };
  }
}

// 概览统计 - 回应
message DashboardOverviewResponse {
  uint32 user_count = 1;            // 用户总数
  uint32 role_count = 2;            // 角色总数
  uint32 today_login_count = 3;     // 今日登录次数
  uint32 today_operation_count = 4; // 今日操作审计条数
}

// 登录趋势 - 请求
message GetLoginTrendRequest {
  optional int32 days = 1 [
    json_name = "days",
    (gnostic.openapi.v3.property) = {description: "统计天数，默认 7"}
  ]; // 统计天数，默认 7
}

// 登录趋势 - 回应
message LoginTrendResponse {
  repeated TrendPoint points = 1; // 按日期升序排列
}

// 趋势数据点
message TrendPoint {
  string date = 1;  // 日期，格式 YYYY-MM-DD
  uint32 count = 2; // 当日次数
}

// 操作类型分布 - 回应
message ActionDistributionResponse {
  repeated DistributionItem items = 1; // label 为 action 枚举名（CREATE/UPDATE/...）
}

// 登录状态分布 - 回应
message StatusDistributionResponse {
  repeated DistributionItem items = 1; // label 为 status 枚举名（SUCCESS/FAILED/...）
}

// 分布数据项
message DistributionItem {
  string label = 1; // 枚举名
  uint32 count = 2; // 数量
}

// 异常告警条目（规则预筛的确定性事实，非模型生成）
message AiInsightAlert {
  string severity = 1; // HIGH / MEDIUM / LOW
  string title = 2;    // 告警标题（含关键数字）
  string detail = 3;   // 明细与处置建议
}

// AI 概览解读 - 回应
message AiInsightsResponse {
  repeated AiInsightAlert alerts = 1; // 异常告警（无异常为空）
  string summary = 2;                 // 总体评估（LLM 生成；无告警时为固定文案）
  repeated string insights = 3;       // 告警要点（severity+title，兼容旧渲染）
}
