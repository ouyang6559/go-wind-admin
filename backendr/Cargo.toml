[package]
name = "backendr"
version = "0.1.0"
edition = "2021"
description = "GoWind Admin API — Rust/axum rewrite"
license = "MIT"
rust-version = "1.75"

# 依赖栈参考 qiluo 项目（axum + sqlx/bb8 + redis + jwt/argon2）的主流未来趋势技术栈
[dependencies]
# Web 框架
axum = { version = "0.8", features = ["json", "macros", "multipart"] }
axum-extra = "0.10"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "compression-gzip", "catch-panic"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }

# 数据层
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "chrono", "json", "uuid", "rust_decimal", "macros"] }
redis = { version = "0.30", features = ["tokio-comp", "json"] }
futures = "0.3"
async-trait = "0.1"

# 序列化 / 配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
schemars = { version = "0.8", features = ["chrono", "uuid"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# 错误 / 工具
thiserror = "2"
anyhow = "1"
once_cell = "1"
lazy_static = "1"
percent-encoding = "2"

# 日志 / 可观测
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# 认证 / 安全
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
captcha_rust = "0.1"
password-hash = "0.5"
bcrypt = "0.15"
aes = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"

# 校验 / 邮件 / 辅助
validator = { version = "0.19", features = ["derive"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "pool"] }
cron_clock = "0.8"
byte-unit = "5"
humansize = "2"
mac_address = "1"
hmac = "0.12"
hex = "0.4"

# HTTP 客户端（第三方/文件等）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 运行时辅助
backon = "0.4"
totp-rs = { version = "5.7.2", features = ["otpauth", "qr", "gen_secret"] }

# 脚本执行引擎（test_run）：Lua 用 mlua（vendored），JavaScript 用 boa_engine（纯 Rust）
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
boa_engine = "0.20"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
